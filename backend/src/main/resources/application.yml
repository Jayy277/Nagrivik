server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: nagrivic-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nagrivic}}
    username: ${DB_USERNAME:nagrivic}
    password: ${DB_PASSWORD:nagrivic_dev_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:true}
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: ${SPRING_MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${SPRING_MULTIPART_MAX_REQUEST_SIZE:15MB}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

nagrivic:
  auth:
    otp:
      provider: ${OTP_PROVIDER:DEV}
      expiration-minutes: ${OTP_EXPIRATION_MINUTES:5}
      cooldown-seconds: ${OTP_COOLDOWN_SECONDS:60}
      max-attempts: ${OTP_MAX_ATTEMPTS:5}
    google:
      client-ids: ${GOOGLE_CLIENT_IDS:nagrivic-dev-web-client-id,nagrivic-dev-android-client-id,nagrivic-dev-ios-client-id}
    jwt:
      secret: ${JWT_SECRET:nagrivic-default-dev-secret-key-that-is-at-least-256-bits-long-change-in-production}
      access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
      refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:30}
  media:
    max-file-size-mb: ${MEDIA_MAX_FILE_SIZE_MB:10}
    local-storage-dir: ${MEDIA_LOCAL_STORAGE_DIR:build/uploads}
  duplicates:
    detection-radius-meters: ${DUPLICATE_DETECTION_RADIUS_METERS:100.0}
    max-citizen-candidates: ${DUPLICATE_MAX_CITIZEN_CANDIDATES:5}
  moderation:
    rate-limit:
      comment-per-minute: ${RATE_LIMIT_COMMENT_PER_MINUTE:5}
      issue-per-hour: ${RATE_LIMIT_ISSUE_PER_HOUR:10}
      report-per-hour: ${RATE_LIMIT_REPORT_PER_HOUR:10}
      support-per-minute: ${RATE_LIMIT_SUPPORT_PER_MINUTE:20}
      otp-per-minute: ${RATE_LIMIT_OTP_PER_MINUTE:3}
      google-auth-per-minute: ${RATE_LIMIT_GOOGLE_AUTH_PER_MINUTE:10}

